# Render blueprint for the API only (the site itself goes on Vercel, see README → Deploy).
# Deploy from the repo root: the server imports shared/seedData.js, which lives outside server/.
services:
  - type: web
    name: karan-portfolio-api
    runtime: node
    plan: free
    buildCommand: npm install
    startCommand: npm start -w server
    healthCheckPath: /api/health
    envVars:
      - key: MONGODB_URI
        sync: false
      - key: CORS_ORIGIN # your Vercel URL(s), comma-separated, no trailing slash
        sync: false
      - key: ADMIN_PASSWORD
        sync: false
      - key: JWT_SECRET
        generateValue: true
      - key: CONTACT_TO
        sync: false
      - key: SMTP_HOST
        sync: false
      - key: SMTP_PORT
        value: "587"
      - key: SMTP_USER
        sync: false
      - key: SMTP_PASS
        sync: false
