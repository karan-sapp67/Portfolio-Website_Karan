<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1" />

    <meta name="theme-color" content="#050507" />

    <meta property="og:type" content="website" />

    <link rel="preconnect" href="https://fonts.googleapis.com" />
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />

      rel="stylesheet"
    />

  <body>
    <div class="preloader" id="preloader" role="status" aria-live="polite">
      <div class="pre-count"><span id="pre-num">0</span><small>%</small></div>
      <div class="pre-bar"><i id="pre-bar"></i></div>
    </div>

    <div class="cursor-dot" aria-hidden="true"></div>
    <div class="cursor-ring" aria-hidden="true"></div>
    <div class="grain" aria-hidden="true"></div>
    <div class="vignette" aria-hidden="true"></div>

    <a class="skip" href="#about">Skip to content</a>
    <header class="nav" id="nav"></header>

    <main id="main">
      <section class="hero" id="top" aria-label="Introduction">
        <div class="hero-track" id="hero-track">
          <div class="hero-sticky">
            <div id="bgArt" aria-hidden="true"></div>
            <canvas id="hero-canvas" aria-hidden="true"></canvas>
            <div id="collage" class="collage" aria-hidden="true"></div>
            <p class="hero-hint" id="hero-hint">Scroll to begin</p>
            <div class="hero-copy" id="hero-copy">
              <h1 class="hero-name" id="hero-name"></h1>
              <p class="hero-tag"><span id="hero-tag"></span></p>
            </div>
          </div>
        </div>
      </section>

      <section id="about" class="section" aria-labelledby="about-h"></section>
      <section id="projects" class="section section--projects" aria-labelledby="projects-h"></section>
      <section id="skills" class="section" aria-labelledby="skills-h"></section>
      <section id="journey" class="section" aria-labelledby="journey-h"></section>
      <section id="contact" class="section section--contact" aria-labelledby="contact-h"></section>
    </main>
    <footer class="footer" id="footer"></footer>

    <script type="module" src="/src/main.js"></script>
